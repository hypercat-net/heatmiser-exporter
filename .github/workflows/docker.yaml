name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate versioned image tags on a fresh test run. main/PR builds stay independent.
  test:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/tests.yaml

  build:
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hypercat42/heatmiser-exporter
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Docker Hub description
        if: github.event_name != 'pull_request'
        run: |
          awk '
            /^## (Installation|Development)$/ { in_excluded_section = 1; next }
            in_excluded_section && /^### Docker$/ {
              print "## Docker"
              in_excluded_section = 0
              found_docker = 1
              next
            }
            in_excluded_section && /^## / { in_excluded_section = 0 }
            in_excluded_section { next }
            { print }
            END { if (!found_docker) exit 1 }
          ' README.md > "$RUNNER_TEMP/dockerhub-readme.md"

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: hypercat42/heatmiser-exporter
          readme-filepath: ${{ runner.temp }}/dockerhub-readme.md
          short-description: Prometheus exporter for the IMI Heatmiser NeoHub, built on heatmiser-neohub.
